name: Maestro Android UI Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [test/maestro-android-smoke-2026-10-28]
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".maestro/**"
      - ".github/workflows/maestro-android-smoke.yml"

permissions:
  contents: read

concurrency:
  group: maestro-android-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-ui-smoke:
    name: Build APK and run Maestro on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate mobile client
        run: |
          npm install --no-audit --no-fund
          npm run test:contract
          node --check web/app.js

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not configured."; exit 1; }
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "Android SDK manager not found."; exit 1; }
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Install Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run UI smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/flows/smoke.yaml

      - name: Upload debug APK for local testing
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DGM-MAT-Mobile-Maestro-smoke-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
